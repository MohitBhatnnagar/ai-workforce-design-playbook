[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workforce-design-playbook"
version = "0.1.0"
description = "Method and scoring tool for deciding which work AI agents should do alone, with approval, or not at all"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
taskscore = "taskscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
